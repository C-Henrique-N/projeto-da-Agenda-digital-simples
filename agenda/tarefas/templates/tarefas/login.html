<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>

    <h1>Login</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Entrar</button>

        <p>não possuí uma conta?</p>
        <a href="{% url 'cadastro' %}">criar uma conta</a>
    </form>
    
</body>
</html>
