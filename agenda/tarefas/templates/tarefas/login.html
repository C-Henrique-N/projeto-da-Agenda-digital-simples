{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'tarefas/login.css' %}">
</head>
<body>

<div class="container">

    <div class="topo">

        <div class="bolinha b1"></div>
        <div class="bolinha b2"></div>
        <div class="bolinha b3"></div>
        <div class="bolinha b4"></div>
        <div class="bolinha b5"></div>
        <div class="bolinha b6"></div>

        <img src="{% static 'tarefas/img/logo.png' %}" alt="Logo" class="logo">

    </div>

    <div class="login">

        <h1>Login</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Usuário</label>
            {{ form.username }}

            <label>Senha</label>
            {{ form.password }}

            {% if form.errors %}
                <p style="color:red; margin-bottom:15px;">
                    Usuário ou senha incorretos.
                </p>
            {% endif %}

            <button type="submit">
                Entrar
            </button>

            <p style="margin-top:20px;">
                Não possui uma conta?
            </p>

            <a href="{% url 'cadastro' %}">
                Criar uma conta
            </a>

        </form>

    </div>

</div>

</body>
</html>
