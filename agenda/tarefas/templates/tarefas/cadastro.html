{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="{% static 'tarefas/cadastro.css' %}">
</head>
<body>

<div class="container">

    <header class="header">

        <span class="circle c1"></span>
        <span class="circle c2"></span>
        <span class="circle c3"></span>
        <span class="circle c4"></span>
        <span class="circle c5"></span>
        <span class="circle c6"></span>

        <img src="{% static 'tarefas/img/logo.png' %}" alt="Logo">

    </header>

    <main class="card">

        <h1>Criar uma Conta</h1>

        <form method="POST">
            {% csrf_token %}

            <label>Nome do usuário</label>
            {{ form.username }}

            <label>Senha</label>
            {{ form.password1 }}

            <label>Confirmar senha</label>
            {{ form.password2 }}

            <button type="submit">
                Cadastrar
            </button>

        </form>

        <p class="login">
            Você já possui uma conta?
            <a href="{% url 'login' %}">Entrar</a>
        </p>

    </main>

</div>

</body>
</html>
