<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="topo">

        <div class="bolinha b1"></div>
        <div class="bolinha b2"></div>
        <div class="bolinha b3"></div>
        <div class="bolinha b4"></div>
        <div class="bolinha b5"></div>
        <div class="bolinha b6"></div>

        <!-- Coloque sua logo na mesma pasta do HTML ou ajuste o caminho -->
        <img src="GC team (2).png" alt="Logo" class="logo">

    </div>

    <div class="login">

        <h1>Login</h1>

        <form action="" method="POST">

            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">Entrar</button>

            <p>Não possui uma conta?</p>

            <a href="cadastro.html">Criar uma conta</a>

        </form>

    </div>

</div>

</body>
</html>
